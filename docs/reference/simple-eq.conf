# REFERENCE ONLY: superseded by the measured tuning in imac-audio-installer/.
# Final hand-tuned stereo EQ from 2026-11-14 (before the imac27 quirk was found).
# Don't run it together with the measured tuning (EQs would stack).
# iMac17,1 (27" Late 2015, CS4206) internal speaker tuning.
# Creates a virtual sink "iMac Speakers (Tuned)" that EQs audio, then
# forwards it to the built-in analog output. Remove this file and
# run `systemctl --user restart pipewire` to undo.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "iMac Speakers (Tuned)"
      media.name       = "iMac Speakers (Tuned)"
      filter.graph = {
        nodes = [
          # Headroom so bass boost doesn't clip
          { type = builtin name = pre  label = linear control = { "Mult" = 0.5 "Add" = 0.0 } }
          # Protect woofers from sub-bass they can't reproduce
          { type = builtin name = hpf  label = bq_highpass  control = { "Freq" = 45.0 "Q" = 0.707 } }
          # Bass warmth (main thing macOS adds)
          { type = builtin name = bass label = bq_lowshelf  control = { "Freq" = 140.0 "Q" = 0.7 "Gain" = 3.0 } }
          # Tame boxy low-mids
          { type = builtin name = mud  label = bq_peaking   control = { "Freq" = 400.0 "Q" = 1.0 "Gain" = -3.5 } }
          # Slight presence/air lift (drivers face downward)
          { type = builtin name = pres label = bq_peaking   control = { "Freq" = 3500.0 "Q" = 1.0 "Gain" = 2.5 } }
          { type = builtin name = air  label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 3.0 } }
        ]
        links = [
          { output = "pre:Out"  input = "hpf:In" }
          { output = "hpf:Out"  input = "bass:In" }
          { output = "bass:Out" input = "mud:In" }
          { output = "mud:Out"  input = "pres:In" }
          { output = "pres:Out" input = "air:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name   = "effect_input.imac_speakers"
        media.class = Audio/Sink
      }
      playback.props = {
        node.name     = "effect_output.imac_speakers"
        node.passive  = true
        target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
      }
    }
  }
]
